<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f3f4f6;padding:24px 12px;">
  <tr><td align="center">
    <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;background:#ffffff;border-radius:12px;overflow:hidden;border:1px solid #e5e7eb;">
      <tr><td style="padding:20px 32px;background:#4f46e5;">
        <span style="font-size:20px;font-weight:800;letter-spacing:-0.3px;color:#ffffff;">OfferBridge</span>
      </td></tr>
      <tr><td style="padding:32px;">
        <h1 style="margin:0 0 12px;font-size:20px;line-height:1.3;color:#111827;">Your verification code</h1>
        <p style="margin:0 0 20px;font-size:15px;line-height:1.6;color:#374151;">
          Enter this code in OfferBridge to verify your email and activate your account:
        </p>
        <p style="margin:0 0 20px;font-size:34px;font-weight:800;letter-spacing:0.35em;color:#111827;font-family:ui-monospace,Menlo,Consolas,monospace;text-align:center;">{{ .Token }}</p>
        <p style="margin:0;font-size:13px;line-height:1.6;color:#6b7280;">
          The code expires in 1 hour. If you didn't create an OfferBridge account, you can ignore this email.
        </p>
      </td></tr>
      <tr><td style="padding:20px 32px;background:#f9fafb;border-top:1px solid #e5e7eb;">
        <p style="margin:0;font-size:12px;line-height:1.5;color:#9ca3af;">Account security email from OfferBridge.</p>
      </td></tr>
    </table>
  </td></tr>
</table>
